<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Phak Kiu Pantech</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f23;
            color: #e8e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .box {
            max-width: 420px;
            width: 100%;
            background: #1a1a3e;
            border: 1px solid #2a2a5a;
            border-radius: 12px;
            padding: 28px;
        }
        h1 { font-size: 1.2rem; color: #ffd700; margin-bottom: 8px; }
        p { color: #888; font-size: 0.9rem; margin-bottom: 20px; line-height: 1.5; }
        a {
            display: block;
            padding: 14px 16px;
            margin-bottom: 10px;
            border-radius: 8px;
            text-decoration: none;
            color: #fff;
            background: #2a2a5a;
            font-weight: 600;
            font-size: 0.95rem;
        }
        a:hover { background: #3a3a7a; }
        a.primary { background: #2ecc71; color: #0f0f23; }
        a.primary:hover { background: #27ae60; color: #fff; }
        .home { text-align: center; margin-top: 16px; font-size: 0.85rem; }
        .home a { display: inline; background: none; padding: 0; color: #00bcd4; }
    </style>
    <script src="shared/js/league-context.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (!window.ArisanLeagueContext) return;
            var matchLink = document.getElementById('admin-match-example');
            var homeLink = document.getElementById('admin-home-link');
            var setupLink = document.getElementById('admin-setup-link');
            var communityLink = document.getElementById('admin-community-link');
            if (matchLink) matchLink.href = ArisanLeagueContext.adminUrl('hash-pku', 'wc-2026');
            if (homeLink) homeLink.href = ArisanLeagueContext.siteIndexUrl();
            if (setupLink) setupLink.href = ArisanLeagueContext.appUrl('admin/setup.html');
            if (communityLink) communityLink.href = ArisanLeagueContext.appUrl('admin/community.html');
        });
    </script>
</head>
<body>
    <div class="box">
        <h1>Arisan Admin</h1>
        <p>Choose admin type:</p>
        <a href="#" id="admin-community-link">🏘️ Create community — register in database only</a>
        <a href="#" id="admin-setup-link" class="primary">🏗️ New league setup — participants, countries, awards</a>
        <a href="#" id="admin-match-example">⚽ Update Match — skor per liga (contoh HASH PKU / wc-2026)</a>
        <p class="home"><a href="#" id="admin-home-link">← Home</a></p>
    </div>
</body>
</html>
