<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Arisan WC 2026</title>
    <script src="supabase-public.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background: #0f0f23;
            color: #e8e8f0;
            min-height: 100vh;
            padding: 24px 16px 88px;
        }
        .wrap { max-width: 920px; margin: 0 auto; }
        h1 { font-size: 1.4rem; color: #ffd700; margin-bottom: 4px; }
        .subtitle { color: #888; font-size: 0.85rem; margin-bottom: 24px; }
        .card {
            background: #1a1a3e;
            border: 1px solid #2a2a5a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 1rem;
            color: #00bcd4;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid #2a2a5a;
        }
        .card p.hint { font-size: 0.8rem; color: #888; margin-bottom: 12px; line-height: 1.5; }
        label { display: block; font-size: 0.82rem; color: #aaa; margin-bottom: 6px; }
        input[type="text"], input[type="password"], input[type="number"], select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #3a3a6a;
            background: #12122a;
            color: #fff;
            font-size: 0.95rem;
            margin-bottom: 12px;
        }
        input[type="number"] { width: 80px; margin-bottom: 0; }
        .pin-box { max-width: 360px; margin: 80px auto; text-align: center; }
        .pin-box input { text-align: center; letter-spacing: 8px; font-size: 1.2rem; }
        .btn {
            display: inline-block;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            margin-right: 8px;
            margin-top: 4px;
        }
        .btn-primary { background: #e94560; color: #fff; }
        .btn-primary:hover { background: #ff6b81; }
        .btn-secondary { background: #2a2a5a; color: #fff; }
        .btn-secondary:hover { background: #3a3a7a; }
        .btn-success { background: #2ecc71; color: #0f0f23; }
        .btn-success:hover { background: #27ae60; color: #fff; }
        .btn-danger { background: transparent; color: #e94560; border: 1px solid #e94560; padding: 6px 12px; font-size: 0.8rem; }
        .btn-danger:hover { background: #e94560; color: #fff; }
        .toolbar { display: none; }
        .floating-nav {
            position: fixed;
            bottom: max(16px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 10px 12px 8px;
            background: rgba(18, 18, 42, 0.94);
            border: 1px solid rgba(42, 42, 90, 0.95);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .floating-nav-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .float-status {
            font-size: 0.78rem;
            color: #2ecc71;
            text-align: center;
            max-width: 280px;
            line-height: 1.35;
            padding: 0 6px;
        }
        .float-status:empty { display: none; }
        .float-status.error { color: #e94560; }
        .float-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 14px;
            border-radius: 999px;
            border: none;
            font-size: 0.8rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            color: #fff;
            background: #2a2a5a;
            transition: background 0.2s, transform 0.15s;
        }
        .float-btn:hover { background: #3a3a7a; }
        .float-btn:active { transform: scale(0.97); }
        .float-btn-save { background: #2ecc71; color: #0f0f23; }
        .float-btn-save:hover { background: #27ae60; color: #fff; }
        .match-row {
            display: grid;
            grid-template-columns: minmax(120px, 1fr) 100px 44px 44px 44px 44px 100px;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px;
            padding: 10px;
            background: #12122a;
            border-radius: 8px;
        }
        .match-row select { margin-bottom: 0; }
        .match-row input[type="number"].score-ft-0,
        .match-row input[type="number"].score-et-0,
        .match-row input[type="number"].score-ft-1,
        .match-row input[type="number"].score-et-1 {
            width: 100%;
            margin-bottom: 0;
            padding: 8px 2px;
            text-align: center;
        }
        .match-row .winner:disabled { opacity: 0.35; cursor: not-allowed; }
        .match-row .match-label { font-size: 0.85rem; line-height: 1.35; }
        .match-fields { display: contents; }
        .mf-label { display: none; }
        .match-header {
            display: grid;
            grid-template-columns: minmax(120px, 1fr) 100px 44px 44px 44px 44px 100px;
            gap: 8px;
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 6px;
            padding: 0 10px;
        }
        .match-header span:nth-child(n+3) {
            text-align: center;
            font-size: 0.68rem;
            line-height: 1.2;
        }
        .gb-row, .gg-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: #12122a;
            border-radius: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .gb-row .name, .gg-row .name { flex: 1; min-width: 140px; font-weight: 600; }
        .gg-checks {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .gg-row label.inline { display: inline-flex; align-items: center; gap: 6px; margin: 0; color: #ccc; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }
        .gg-row label.inline input { width: auto; margin: 0; }
        .deploy-steps {
            background: #12122a;
            border-radius: 8px;
            padding: 14px;
            font-size: 0.85rem;
            line-height: 1.7;
            color: #aaa;
        }
        .deploy-steps ol { margin-left: 18px; }
        .deploy-steps strong { color: #ffd700; }
        a.link { color: #00bcd4; }
        .hidden { display: none !important; }
        @media (max-width: 640px) {
            .match-header { display: none; }
            .match-row {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .match-fields {
                display: grid;
                grid-template-columns: minmax(0, 1fr) 36px 36px 36px 36px minmax(0, 0.9fr);
                gap: 4px 4px;
                align-items: center;
                width: 100%;
            }
            .mf-label {
                display: block;
                font-size: 0.62rem;
                color: #666;
                text-transform: uppercase;
                letter-spacing: 0.03em;
                line-height: 1.2;
            }
            .match-fields select,
            .match-fields input[type="number"] {
                width: 100%;
                min-width: 0;
                font-size: 0.8rem;
                padding: 8px 2px;
            }
            .gg-row {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .gg-row .name {
                min-width: 0;
                flex: none;
            }
            .gg-checks {
                display: flex;
                flex-wrap: nowrap;
                gap: 16px;
                width: 100%;
            }
            .float-btn { padding: 10px 12px; font-size: 0.74rem; }
        }
    </style>
</head>
<body>
    <div id="pin-screen" class="wrap">
        <div class="card pin-box">
            <h1>🔐 Admin Panel</h1>
            <p class="subtitle" style="margin-bottom: 20px;">Arisan World Cup 2026 HASH PKU</p>
            <label for="pin-input">PIN 5 digit</label>
            <input type="password" id="pin-input" maxlength="5" inputmode="numeric" autocomplete="off" placeholder="•••••">
            <p id="pin-error" class="status error hidden" style="margin-top: 8px;">PIN salah</p>
            <button class="btn btn-primary" style="width:100%; margin-top: 8px;" onclick="checkPin()">Masuk</button>
        </div>
    </div>

    <div id="admin-panel" class="wrap hidden">
        <h1>⚙️ Admin Panel</h1>

        <!-- 1. Match Status & Skor -->
        <div class="card">
            <h2>1. Kelola Match</h2>
            <div class="match-header">
                <span>Match</span>
                <span>Status</span>
                <span>Score FT T1</span>
                <span>Score ET T1</span>
                <span>Score FT T2</span>
                <span>Score ET T2</span>
                <span>Winner</span>
            </div>
            <div id="matches-list"></div>
        </div>

        <!-- 2. Golden Boot -->
        <div class="card">
            <h2>2. Golden Boot</h2>
            <div id="golden-boot-list"></div>
        </div>

        <!-- 3. Golden Glove -->
        <div class="card">
            <h2>3. Golden Glove</h2>
            <div id="golden-glove-list"></div>
        </div>
    </div>

    <nav class="floating-nav hidden" id="floating-nav" aria-label="Navigasi admin">
        <p id="action-status" class="float-status"></p>
        <div class="floating-nav-buttons">
            <a href="index.html" class="float-btn">🏠 Home</a>
            <button type="button" class="float-btn float-btn-save" id="btn-deploy-supabase" onclick="deployToSupabase()">💾 Save</button>
        </div>
    </nav>

    <script>
        const ADMIN_PIN = '26889';
        const AUTH_KEY = 'arisan_admin_auth';

        const MATCH_CATALOG = [
            { id: 'group-0',  label: 'Grup — Afrika Selatan vs Kanada' },
            { id: 'group-1',  label: 'Grup — Belanda vs Maroko' },
            { id: 'group-2',  label: 'Grup — Jerman vs Paraguay' },
            { id: 'group-3',  label: 'Grup — Prancis vs Swedia' },
            { id: 'group-4',  label: 'Grup — Belgia vs Senegal' },
            { id: 'group-5',  label: 'Grup — Amerika Serikat vs Bosnia-Herzegovina' },
            { id: 'group-6',  label: 'Grup — Spanyol vs Austria' },
            { id: 'group-7',  label: 'Grup — Portugal vs Kroasia' },
            { id: 'group-8',  label: 'Grup — Brasil vs Jepang' },
            { id: 'group-9',  label: 'Grup — Pantai Gading vs Norwegia' },
            { id: 'group-10', label: 'Grup — Meksiko vs Ekuador' },
            { id: 'group-11', label: 'Grup — Inggris vs RD Kongo' },
            { id: 'group-12', label: 'Grup — Swiss vs Aljazair' },
            { id: 'group-13', label: 'Grup — Kolombia vs Ghana' },
            { id: 'group-14', label: 'Grup — Australia vs Mesir' },
            { id: 'group-15', label: 'Grup — Argentina vs Tanjung Verde' },
            { id: 'r16-0',    label: '16 Besar — Kanada vs Maroko' },
            { id: 'r16-1',    label: '16 Besar — Paraguay vs Prancis' },
            { id: 'r16-2',    label: '16 Besar — (TBD) vs (TBD)' },
            { id: 'r16-3',    label: '16 Besar — (TBD) vs (TBD)' },
            { id: 'r16-4',    label: '16 Besar — Brasil vs Norwegia' },
            { id: 'r16-5',    label: '16 Besar — Meksiko vs Inggris' },
            { id: 'r16-6',    label: '16 Besar — (TBD) vs (TBD)' },
            { id: 'r16-7',    label: '16 Besar — (TBD) vs (TBD)' },
            { id: 'qf-0',     label: 'Perempat Final — Match 1' },
            { id: 'qf-1',     label: 'Perempat Final — Match 2' },
            { id: 'qf-2',     label: 'Perempat Final — Match 3' },
            { id: 'qf-3',     label: 'Perempat Final — Match 4' },
            { id: 'sf-0',     label: 'Semifinal — Match 1' },
            { id: 'sf-1',     label: 'Semifinal — Match 2' },
            { id: 'final-0',  label: 'Final' },
        ];

        const MATCH_STATUSES = [
            { value: 'finished', label: 'Selesai' },
            { value: 'live', label: 'Live' },
            { value: 'waiting-admin', label: 'Waiting for Admin' },
        ];

        const TOURNAMENT_YEAR = 2026;
        const INDONESIAN_MONTHS = {
            januari: 0, februari: 1, maret: 2, april: 3, mei: 4, juni: 5,
            juli: 6, agustus: 7, september: 8, oktober: 9, november: 10, desember: 11
        };

        const MATCH_SCHEDULE = {
            'group-0':  'Sen, 6/29, 00:00 WIB',
            'group-1':  'Sel, 6/30, 08:00 WIB',
            'group-2':  'Sel, 6/30, 03:30 WIB',
            'group-3':  'Rab, 1 Juli, 04:00 WIB',
            'group-4':  'Kam, 2 Juli, 03:00 WIB',
            'group-5':  'Kam, 2 Juli, 07:00 WIB',
            'group-6':  'Jum, 3 Juli, 02:00 WIB',
            'group-7':  'Jum, 3 Juli, 06:00 WIB',
            'group-8':  'Sel, 6/30, 00:00 WIB',
            'group-9':  'Rab, 1 Juli, 00:00 WIB',
            'group-10': 'Rab, 1 Juli, 08:00 WIB',
            'group-11': 'Rab, 1 Juli, 23:00 WIB',
            'group-12': 'Jum, 3 Juli, 10:00 WIB',
            'group-13': 'Sab, 4 Juli, 08:30 WIB',
            'group-14': 'Sab, 4 Juli, 01:00 WIB',
            'group-15': 'Sab, 4 Juli, 05:00 WIB',
            'r16-0':    'Min, 5 Juli, 00:00 WIB',
            'r16-1':    'Min, 5 Juli, 04:00 WIB',
            'r16-2':    'Sel, 7 Juli, 07:00 WIB',
            'r16-3':    'Sel, 7 Juli, 02:00 WIB',
            'r16-4':    'Sen, 6 Juli, 03:00 WIB',
            'r16-5':    'Sen, 6 Juli, 07:00 WIB',
            'r16-6':    'Rab, 8 Juli, 03:00 WIB',
            'r16-7':    'Sel, 7 Juli, 23:00 WIB',
            'qf-0':     'Jum, 10 Juli, 03:00 WIB',
            'qf-1':     'Sab, 11 Juli, 02:00 WIB',
            'qf-2':     'Min, 12 Juli, 04:00 WIB',
            'qf-3':     'Min, 12 Juli, 08:00 WIB',
            'sf-0':     '15 Juli, 02:00 WIB',
            'sf-1':     '16 Juli, 02:00 WIB',
            'final-0':  '20 Juli, 02:00 WIB',
        };

        let config = null;

        function makeWIBDate(year, monthIndex, day, hour, minute) {
            return new Date(Date.UTC(year, monthIndex, day, hour - 7, minute));
        }

        function parseMatchupDateWIB(dateText) {
            const text = (dateText || '').trim();
            if (!text) return null;

            let match = text.match(/^(?:\w+,\s*)?(\d{1,2})\s+(\w+),?\s+(\d{1,2}):(\d{2})\s*WIB$/i);
            if (match) {
                const monthIndex = INDONESIAN_MONTHS[match[2].toLowerCase()];
                if (monthIndex === undefined) return null;
                return makeWIBDate(
                    TOURNAMENT_YEAR,
                    monthIndex,
                    parseInt(match[1], 10),
                    parseInt(match[3], 10),
                    parseInt(match[4], 10)
                );
            }

            match = text.match(/^(?:\w+,\s*)?(\d{1,2})\/(\d{1,2}),?\s+(\d{1,2}):(\d{2})\s*WIB$/i);
            if (match) {
                return makeWIBDate(
                    TOURNAMENT_YEAR,
                    parseInt(match[1], 10) - 1,
                    parseInt(match[2], 10),
                    parseInt(match[3], 10),
                    parseInt(match[4], 10)
                );
            }

            return null;
        }

        function getMatchScheduleTime(matchId) {
            const scheduleText = MATCH_SCHEDULE[matchId];
            if (!scheduleText) return Infinity;
            const matchTime = parseMatchupDateWIB(scheduleText);
            return matchTime ? matchTime.getTime() : Infinity;
        }

        function isMatchSchedulePast(matchId) {
            const t = getMatchScheduleTime(matchId);
            return t !== Infinity && t <= Date.now();
        }

        function sortMatchesBySchedule(matches) {
            matches.sort((a, b) => getMatchScheduleTime(b.id) - getMatchScheduleTime(a.id));
        }

        function syncPastScheduleMatches() {
            if (!config.finishedMatches) config.finishedMatches = [];
            const existingIds = new Set(config.finishedMatches.map(m => m.id));
            const now = Date.now();

            MATCH_CATALOG.forEach(m => {
                const scheduleText = MATCH_SCHEDULE[m.id];
                if (!scheduleText || existingIds.has(m.id)) return;
                const matchTime = parseMatchupDateWIB(scheduleText);
                if (!matchTime || matchTime.getTime() > now) return;
                config.finishedMatches.push({
                    id: m.id,
                    label: m.label,
                    status: 'waiting-admin',
                    scores: { ft: ['0', '0'], et: ['0', '0'] },
                });
                existingIds.add(m.id);
            });

            config.finishedMatches = config.finishedMatches.filter(m => isMatchSchedulePast(m.id));
            sortMatchesBySchedule(config.finishedMatches);
        }

        function formatLastUpdatedNow() {
            const d = new Date();
            const bulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            const jam = String(d.getHours()).padStart(2, '0');
            const menit = String(d.getMinutes()).padStart(2, '0');
            return d.getDate() + ' ' + bulan[d.getMonth()] + ' ' + d.getFullYear() + ', ' + jam + ':' + menit + ' WIB';
        }

        async function checkPin() {
            const input = document.getElementById('pin-input').value.trim();
            const err = document.getElementById('pin-error');
            if (input === ADMIN_PIN) {
                sessionStorage.setItem(AUTH_KEY, '1');
                err.classList.add('hidden');
                await loadConfig();
                showAdmin();
            } else {
                err.classList.remove('hidden');
            }
        }

        document.getElementById('pin-input').addEventListener('keydown', e => {
            if (e.key === 'Enter') checkPin();
        });

        function logout() {
            sessionStorage.removeItem(AUTH_KEY);
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('pin-screen').classList.remove('hidden');
            document.getElementById('pin-input').value = '';
            document.getElementById('floating-nav').classList.add('hidden');
        }

        async function loadConfig() {
            try {
                config = await ArisanConfigSources.fetchConfig();
            } catch (e) {
                config = { lastUpdated: '', finishedMatches: [], goldenBoot: [], goldenGlove: [] };
            }
            (config.finishedMatches || []).forEach(m => {
                if (!m.status) m.status = 'finished';
            });
        }

        function showAdmin() {
            document.getElementById('pin-screen').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
            document.getElementById('floating-nav').classList.remove('hidden');
            renderMatches();
            renderGoldenBoot();
            renderGoldenGlove();
        }

        function getMatchLabel(id) {
            const m = MATCH_CATALOG.find(x => x.id === id);
            return m ? m.label : id;
        }

        function renderMatches() {
            syncPastScheduleMatches();
            const list = document.getElementById('matches-list');
            list.innerHTML = '';
            (config.finishedMatches || []).forEach((match, idx) => {
                list.appendChild(createMatchRow(match, idx));
            });
        }

        function parseScoreInput(val) {
            const n = parseInt(String(val ?? '').replace(/[^\d].*$/, ''), 10);
            return Number.isNaN(n) ? 0 : Math.max(0, n);
        }

        function splitLegacyScoreString(scoreStr) {
            const text = String(scoreStr ?? '').trim();
            const m = text.match(/^(\d+)\s*\(\s*(\d+)\s*\)$/);
            if (m) {
                return { ft: parseInt(m[1], 10), et: parseInt(m[2], 10) };
            }
            const n = parseInt(text, 10);
            return { ft: Number.isNaN(n) ? 0 : n, et: 0 };
        }

        function getMatchScoreParts(match) {
            const scores = match?.scores;
            if (scores && typeof scores === 'object' && !Array.isArray(scores)) {
                return {
                    ft: [
                        parseScoreInput(scores.ft?.[0]),
                        parseScoreInput(scores.ft?.[1]),
                    ],
                    et: [
                        parseScoreInput(scores.et?.[0]),
                        parseScoreInput(scores.et?.[1]),
                    ],
                };
            }
            const legacy0 = splitLegacyScoreString(scores?.[0]);
            const legacy1 = splitLegacyScoreString(scores?.[1]);
            return {
                ft: [legacy0.ft, legacy1.ft],
                et: [legacy0.et, legacy1.et],
            };
        }

        function createScoreInput(className, value) {
            const input = document.createElement('input');
            input.type = 'number';
            input.min = '0';
            input.step = '1';
            input.className = className;
            input.value = value;
            return input;
        }

        function createMatchRow(match, idx) {
            const row = document.createElement('div');
            row.className = 'match-row';
            row.dataset.idx = idx;
            row.dataset.matchId = match.id;

            const status = match.status || 'finished';

            const label = document.createElement('span');
            label.className = 'match-label';
            label.textContent = getMatchLabel(match.id);

            const statusSel = document.createElement('select');
            statusSel.className = 'match-status';
            MATCH_STATUSES.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.value;
                opt.textContent = s.label;
                if (s.value === status) opt.selected = true;
                statusSel.appendChild(opt);
            });

            const scoreParts = getMatchScoreParts(match);

            const sFt0 = createScoreInput('score-ft-0', scoreParts.ft[0]);
            const sEt0 = createScoreInput('score-et-0', scoreParts.et[0]);
            const sFt1 = createScoreInput('score-ft-1', scoreParts.ft[1]);
            const sEt1 = createScoreInput('score-et-1', scoreParts.et[1]);

            const winSel = document.createElement('select');
            winSel.className = 'winner';

            function syncWinnerField() {
                const isFinished = statusSel.value === 'finished';
                const prev = winSel.value;
                winSel.innerHTML = '';
                if (isFinished) {
                    winSel.disabled = false;
                    [['0', 'Team 1'], ['1', 'Team 2']].forEach(([v, t]) => {
                        const opt = document.createElement('option');
                        opt.value = v;
                        opt.textContent = t;
                        winSel.appendChild(opt);
                    });
                    if (prev === '0' || prev === '1') {
                        winSel.value = prev;
                    } else if (match.winner === 0 || match.winner === 1) {
                        winSel.value = String(match.winner);
                    } else {
                        winSel.value = '0';
                    }
                } else {
                    winSel.disabled = true;
                    const opt = document.createElement('option');
                    opt.value = '';
                    opt.textContent = '—';
                    opt.selected = true;
                    winSel.appendChild(opt);
                }
            }
            statusSel.addEventListener('change', syncWinnerField);
            syncWinnerField();

            const matchFields = document.createElement('div');
            matchFields.className = 'match-fields';
            ['Status', 'FT T1', 'ET T1', 'FT T2', 'ET T2', 'Menang'].forEach(text => {
                const lbl = document.createElement('span');
                lbl.className = 'mf-label';
                lbl.textContent = text;
                matchFields.appendChild(lbl);
            });
            matchFields.appendChild(statusSel);
            matchFields.appendChild(sFt0);
            matchFields.appendChild(sEt0);
            matchFields.appendChild(sFt1);
            matchFields.appendChild(sEt1);
            matchFields.appendChild(winSel);

            row.appendChild(label);
            row.appendChild(matchFields);
            return row;
        }

        function renderGoldenBoot() {
            const list = document.getElementById('golden-boot-list');
            list.innerHTML = '';
            (config.goldenBoot || []).forEach((p, idx) => {
                const row = document.createElement('div');
                row.className = 'gb-row';
                row.innerHTML = '<span class="name">' + p.name + '</span>';
                const inp = document.createElement('input');
                inp.type = 'number';
                inp.min = 0;
                inp.value = p.goals;
                inp.dataset.idx = idx;
                inp.className = 'gb-goals';
                row.appendChild(inp);
                row.appendChild(document.createTextNode(' Goal'));
                list.appendChild(row);
            });
        }

        function renderGoldenGlove() {
            const list = document.getElementById('golden-glove-list');
            list.innerHTML = '';
            (config.goldenGlove || []).forEach((p, idx) => {
                const row = document.createElement('div');
                row.className = 'gg-row';
                row.innerHTML = '<span class="name">' + p.name + '</span>';

                const elimLabel = document.createElement('label');
                elimLabel.className = 'inline';
                const elimCb = document.createElement('input');
                elimCb.type = 'checkbox';
                elimCb.className = 'gg-elim';
                elimCb.dataset.idx = idx;
                elimCb.checked = !!p.eliminated;
                elimCb.onchange = () => {
                    if (elimCb.checked) {
                        winCb.checked = false;
                    }
                };
                elimLabel.appendChild(elimCb);
                elimLabel.appendChild(document.createTextNode(' Eliminated'));

                const winLabel = document.createElement('label');
                winLabel.className = 'inline';
                const winCb = document.createElement('input');
                winCb.type = 'checkbox';
                winCb.className = 'gg-winner';
                winCb.dataset.idx = idx;
                winCb.checked = !!p.winner;
                winCb.onchange = () => {
                    if (winCb.checked) {
                        document.querySelectorAll('.gg-winner').forEach((cb, i) => {
                            if (i !== idx) cb.checked = false;
                        });
                        elimCb.checked = false;
                        document.querySelectorAll('.gg-elim').forEach((cb, i) => {
                            if (i !== idx) cb.checked = true;
                        });
                    }
                };
                winLabel.appendChild(winCb);
                winLabel.appendChild(document.createTextNode(' Winner'));

                const checks = document.createElement('div');
                checks.className = 'gg-checks';
                checks.appendChild(elimLabel);
                checks.appendChild(winLabel);

                row.appendChild(checks);
                list.appendChild(row);
            });
        }

        function collectMatches() {
            const rows = document.querySelectorAll('#matches-list .match-row');
            return Array.from(rows).map(row => {
                const id = row.dataset.matchId;
                const status = row.querySelector('.match-status').value;
                const winnerVal = row.querySelector('.winner').value;
                const entry = {
                    id,
                    label: getMatchLabel(id),
                    status,
                    scores: {
                        ft: [
                            String(parseScoreInput(row.querySelector('.score-ft-0').value)),
                            String(parseScoreInput(row.querySelector('.score-ft-1').value)),
                        ],
                        et: [
                            String(parseScoreInput(row.querySelector('.score-et-0').value)),
                            String(parseScoreInput(row.querySelector('.score-et-1').value)),
                        ],
                    },
                };
                if (status === 'finished') {
                    entry.winner = parseInt(winnerVal, 10);
                }
                return entry;
            });
        }

        function collectConfig() {
            const goldenBoot = (config.goldenBoot || []).map((p, idx) => ({
                ...p,
                goals: parseInt(document.querySelectorAll('.gb-goals')[idx]?.value || '0', 10) || 0,
            }));

            const goldenGlove = (config.goldenGlove || []).map((p, idx) => ({
                ...p,
                eliminated: document.querySelectorAll('.gg-elim')[idx]?.checked || false,
                winner: document.querySelectorAll('.gg-winner')[idx]?.checked || false,
            }));

            return {
                lastUpdated: formatLastUpdatedNow(),
                finishedMatches: collectMatches(),
                goldenBoot,
                goldenGlove,
            };
        }

        let statusClearTimer = null;

        function setStatus(msg, isError) {
            const el = document.getElementById('action-status');
            if (!el) return;
            if (statusClearTimer) {
                clearTimeout(statusClearTimer);
                statusClearTimer = null;
            }
            el.textContent = msg;
            el.classList.toggle('error', !!isError);
            if (msg && msg !== 'Saving...') {
                statusClearTimer = setTimeout(() => {
                    el.textContent = '';
                    statusClearTimer = null;
                }, 4000);
            }
        }

        async function deployToSupabase() {
            if (!ArisanConfigSources.isConfigured()) {
                setStatus('Supabase belum dikonfigurasi — isi supabase-public.js (lihat SUPABASE_SETUP.md)', true);
                return;
            }
            if (sessionStorage.getItem(AUTH_KEY) !== '1') {
                setStatus('Login dulu.', true);
                return;
            }
            const btn = document.getElementById('btn-deploy-supabase');
            btn.disabled = true;
            setStatus('Saving...');
            try {
                const data = collectConfig();
                await ArisanConfigSources.uploadConfig(data);
                config = data;
                setStatus('Save sukses! ' + data.lastUpdated);
            } catch (e) {
                setStatus('Save gagal: ' + e.message, true);
            } finally {
                btn.disabled = false;
            }
        }

        (async function init() {
            if (sessionStorage.getItem(AUTH_KEY) === '1') {
                await loadConfig();
                showAdmin();
            }
        })();
    </script>
</body>
</html>
