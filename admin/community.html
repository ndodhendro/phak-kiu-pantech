<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Community — Football Arisan</title>
    <script src="../shared/js/supabase-client.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background: #0f0f23;
            color: #e8e8f0;
            min-height: 100vh;
            padding: 24px 16px 100px;
        }
        .wrap { max-width: 560px; margin: 0 auto; }
        h1 { font-size: 1.4rem; color: #ffd700; margin-bottom: 4px; }
        .subtitle { color: #888; font-size: 0.85rem; margin-bottom: 24px; line-height: 1.5; }
        .card {
            background: #1a1a3e;
            border: 1px solid #2a2a5a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        label { display: block; font-size: 0.82rem; color: #aaa; margin-bottom: 6px; }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #3a3a6a;
            background: #12122a;
            color: #fff;
            font-size: 0.95rem;
            margin-bottom: 12px;
            font-family: inherit;
        }
        .pin-box { max-width: 360px; margin: 80px auto; text-align: center; }
        .btn {
            display: inline-block;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            text-decoration: none;
        }
        .btn-primary { background: #2ecc71; color: #0f0f23; }
        .btn-primary:hover { background: #27ae60; color: #fff; }
        .btn-secondary { background: #2a2a5a; color: #fff; }
        .btn-secondary:hover { background: #3a3a7a; }
        .hidden { display: none !important; }
        .hint { font-size: 0.8rem; color: #888; margin-bottom: 14px; line-height: 1.5; }
        .status { font-size: 0.85rem; margin-top: 12px; color: #2ecc71; min-height: 1.2em; }
        .status.error { color: #e94560; }
        .existing { margin-top: 8px; }
        .existing li {
            list-style: none;
            padding: 10px 12px;
            border: 1px solid #2a2a5a;
            border-radius: 8px;
            margin-bottom: 8px;
            background: #12122a;
            font-size: 0.9rem;
        }
        .existing li span { color: #888; font-size: 0.82rem; }
        .nav-links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    </style>
</head>
<body>
    <div id="main-panel" class="wrap">
        <h1>🏘️ Create Community</h1>
        <p class="subtitle">
            Register a community in the database only. Participants, teams, matches, and awards
            are configured later via <strong>Create/Edit League</strong>.
        </p>

        <div class="card">
            <p class="hint">Slug is used in URLs and folder paths (<code>communities/{slug}/</code>).</p>
            <label for="community-name">Display name</label>
            <input type="text" id="community-name" placeholder="HASH PKU" autocomplete="off">
            <label for="community-slug">Slug</label>
            <input type="text" id="community-slug" placeholder="hash-pku" autocomplete="off">
            <button type="button" class="btn btn-primary" onclick="saveCommunity()">💾 Save community</button>
            <p id="action-status" class="status"></p>
        </div>

        <div class="card">
            <h2 style="font-size:1rem;color:#00bcd4;margin-bottom:12px;">Existing communities</h2>
            <ul class="existing" id="existing-list"></ul>
        </div>

        <div class="nav-links">
            <a href="../index.html" class="btn btn-secondary">🏠 Home</a>
            <a href="setup.html?new=league" class="btn btn-secondary" id="link-new-league">Create/Edit League</a>
        </div>
    </div>

    <script>
        const ROOT_AUTH_KEY = 'arisan_root_auth';

        function requireRootAuth() {
            if (sessionStorage.getItem(ROOT_AUTH_KEY) !== '1') {
                location.href = '../index.html';
                return false;
            }
            return true;
        }

        function slugify(s) {
            return String(s || '').toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        }

        function esc(s) {
            return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
        }

        function setStatus(msg, isError) {
            const el = document.getElementById('action-status');
            el.textContent = msg || '';
            el.classList.toggle('error', !!isError);
        }

        async function renderExisting() {
            const ul = document.getElementById('existing-list');
            try {
                const rows = await ArisanDB.listCommunities();
                if (!rows.length) {
                    ul.innerHTML = '<li><span>No communities yet.</span></li>';
                    return;
                }
                ul.innerHTML = rows.map(c =>
                    '<li><strong>' + esc(c.name) + '</strong><br><span>' + esc(c.slug) +
                    ' · <a href="setup.html?new=league&amp;community=' + encodeURIComponent(c.slug) +
                    '" style="color:#00bcd4;">Create league</a></span></li>'
                ).join('');
            } catch (e) {
                ul.innerHTML = '<li><span class="status error">' + esc(e.message) + '</span></li>';
            }
        }

        async function saveCommunity() {
            if (!ArisanDB.isConfigured()) {
                setStatus('Supabase is not configured.', true);
                return;
            }
            const name = document.getElementById('community-name').value.trim();
            const slug = document.getElementById('community-slug').value.trim();
            if (!name || !slug) {
                setStatus('Display name and slug are required.', true);
                return;
            }
            if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)) {
                setStatus('Slug must be lowercase letters, numbers, and hyphens only.', true);
                return;
            }
            setStatus('Saving…');
            try {
                await ArisanDB.upsertCommunity(slug, name, {});
                setStatus('Community saved: ' + slug);
                document.getElementById('link-new-league').href =
                    'setup.html?new=league&community=' + encodeURIComponent(slug);
                await renderExisting();
            } catch (e) {
                setStatus('Save failed: ' + e.message, true);
            }
        }

        document.getElementById('community-name').addEventListener('input', function () {
            const slugEl = document.getElementById('community-slug');
            if (!slugEl.dataset.manual) slugEl.value = slugify(this.value);
        });
        document.getElementById('community-slug').addEventListener('input', function () {
            this.dataset.manual = this.value.trim() ? '1' : '';
        });

        (async function init() {
            if (!requireRootAuth()) return;
            await renderExisting();
        })();
    </script>
</body>
</html>
