<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phak Kiu Pantech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg0: #0b1220;
            --bg1: #132038;
            --line: rgba(255, 255, 255, 0.12);
            --text: #f3f6fb;
            --muted: #9aa8bd;
            --accent: #2bb0a6;
            --accent-2: #f0b429;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: 'Source Sans 3', sans-serif;
            color: var(--text);
            background:
                radial-gradient(1100px 600px at 10% -10%, rgba(43, 176, 166, 0.22), transparent 55%),
                radial-gradient(900px 500px at 100% 0%, rgba(240, 180, 41, 0.14), transparent 50%),
                linear-gradient(165deg, var(--bg0), var(--bg1) 55%, #0a101a);
            padding: 48px 20px 64px;
        }
        .wrap { max-width: 720px; margin: 0 auto; }
        .brand {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.6rem, 8vw, 4rem);
            letter-spacing: 0.04em;
            line-height: 0.95;
            margin-bottom: 10px;
        }
        .lead {
            color: var(--muted);
            font-size: 1.05rem;
            max-width: 34rem;
            margin-bottom: 20px;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 36px;
        }
        .actions a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 11px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 600;
            border: 1px solid var(--line);
            transition: border-color 0.2s, background 0.2s, transform 0.15s;
        }
        .actions a.primary {
            background: rgba(43, 176, 166, 0.18);
            border-color: rgba(43, 176, 166, 0.45);
            color: var(--text);
        }
        .actions a.primary:hover {
            background: rgba(43, 176, 166, 0.28);
            transform: translateY(-1px);
        }
        .actions a.secondary {
            background: rgba(240, 180, 41, 0.12);
            border-color: rgba(240, 180, 41, 0.35);
            color: var(--text);
        }
        .actions a.secondary:hover {
            background: rgba(240, 180, 41, 0.2);
            transform: translateY(-1px);
        }
        .picker-actions { margin-bottom: 28px; }
        h2 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--accent);
            margin: 0 0 14px;
        }
        .communities-section { margin-bottom: 12px; }
        .communities-section.locked-mode .section-hint {
            color: var(--muted);
            font-size: 0.85rem;
            margin: -6px 0 14px;
        }
        .leagues-section {
            margin-top: 48px;
            padding-top: 36px;
            border-top: 1px solid var(--line);
        }
        .leagues-section .section-context {
            color: var(--muted);
            font-size: 0.95rem;
            margin: -6px 0 20px;
        }
        .list { display: grid; gap: 12px; }
        .card,
        button.card {
            display: block;
            width: 100%;
            text-align: left;
            text-decoration: none;
            color: inherit;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.03);
            padding: 16px 18px;
            border-radius: 8px;
            transition: border-color 0.2s, transform 0.15s, background 0.2s;
            font-family: inherit;
            cursor: pointer;
        }
        a.card:hover,
        button.card:hover {
            border-color: rgba(43, 176, 166, 0.55);
            background: rgba(43, 176, 166, 0.08);
            transform: translateY(-1px);
        }
        button.card.selected {
            border-color: rgba(43, 176, 166, 0.75);
            background: rgba(43, 176, 166, 0.14);
            box-shadow: 0 0 0 1px rgba(43, 176, 166, 0.2);
        }
        .card.locked {
            cursor: default;
            pointer-events: none;
            border-color: rgba(43, 176, 166, 0.75);
            background: rgba(43, 176, 166, 0.14);
            box-shadow: 0 0 0 1px rgba(43, 176, 166, 0.2);
            opacity: 0.95;
        }
        .card strong,
        button.card strong { display: block; font-size: 1.15rem; margin-bottom: 4px; }
        .card span,
        button.card span { color: var(--muted); font-size: 0.9rem; }
        .status { margin-top: 24px; color: var(--muted); font-size: 0.9rem; }
        .leagues-section .status { margin-top: 16px; }
        .status.error { color: #ff7b7b; }
        .hidden { display: none !important; }
        .gate-card {
            max-width: 360px;
            margin: 48px auto 0;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 28px 24px;
            text-align: center;
        }
        .gate-card p {
            color: var(--muted);
            font-size: 0.92rem;
            margin-bottom: 18px;
            line-height: 1.5;
        }
        .gate-card label {
            display: block;
            text-align: left;
            font-size: 0.82rem;
            color: var(--muted);
            margin-bottom: 8px;
        }
        .gate-card input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: rgba(0, 0, 0, 0.25);
            color: var(--text);
            font-size: 1.1rem;
            letter-spacing: 0.2em;
            text-align: center;
            margin-bottom: 12px;
        }
        .gate-card input:focus {
            outline: none;
            border-color: rgba(43, 176, 166, 0.6);
        }
        .gate-card button {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #041018;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }
        .gate-card button:hover { background: #35c4b8; }
        .gate-back {
            display: inline-block;
            margin-top: 16px;
            font-size: 0.88rem;
            color: var(--accent);
            text-decoration: none;
        }
        .gate-back:hover { text-decoration: underline; }
        #gate-error {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #ff7b7b;
        }
    </style>
</head>
<body>
    <div id="gate-screen" class="wrap">
        <h1 class="brand">Phak Kiu Pantech</h1>
        <div class="gate-card">
            <p>Enter password to continue.</p>
            <label for="gate-password">Password</label>
            <input type="password" id="gate-password" maxlength="6" inputmode="numeric" autocomplete="off" placeholder="••••••">
            <button type="button" id="gate-submit">Enter</button>
            <p id="gate-error" class="hidden">Wrong password</p>
            <a href="#" class="gate-back hidden" id="gate-back">← Back</a>
        </div>
    </div>

    <div id="main-app" class="wrap hidden">
        <h1 class="brand">Phak Kiu by Ndod Pantech</h1>

        <div class="actions picker-actions hidden" id="picker-actions">
            <a href="#" class="secondary" id="admin-panel-link">⚙️ Admin Panel</a>
        </div>

        <div class="actions" id="create-actions">
            <a href="admin/community.html" class="primary">Create Community</a>
            <a href="admin/setup.html?new=league" class="secondary">Create/Edit League</a>
        </div>

        <section class="communities-section" id="communities-section">
            <h2>Communities</h2>
            <p class="section-hint hidden" id="community-lock-hint">Your current community</p>
            <div class="list" id="community-list"></div>
        </section>

        <section id="leagues-section" class="leagues-section hidden">
            <h2 class="section-label">Leagues</h2>
            <p class="section-context" id="league-context"></p>
            <div class="list" id="league-list"></div>
            <p class="status" id="league-status"></p>
        </section>

        <p class="status" id="status">Loading…</p>
    </div>

    <script src="shared/js/league-context.js"></script>
    <script src="shared/js/supabase-client.js"></script>
    <script>
        const ROOT_PASSWORD = '696969';
        const AUTH_KEY = 'arisan_root_auth';
        const PICKER_COMMUNITY_KEY = 'arisan_picker_community';
        const PICKER_PENDING_KEY = 'arisan_picker_pending';
        const PICKER_RETURN_KEY = 'arisan_picker_return_community';

        const gateScreen = document.getElementById('gate-screen');
        const mainApp = document.getElementById('main-app');
        const gatePassword = document.getElementById('gate-password');
        const gateError = document.getElementById('gate-error');
        const communityList = document.getElementById('community-list');
        const communitiesSection = document.getElementById('communities-section');
        const communityLockHint = document.getElementById('community-lock-hint');
        const leagueList = document.getElementById('league-list');
        const leaguesSection = document.getElementById('leagues-section');
        const leagueContext = document.getElementById('league-context');
        const leagueStatusEl = document.getElementById('league-status');
        const statusEl = document.getElementById('status');

        let communitiesCache = [];
        let selectedCommunitySlug = null;
        let initAppStarted = false;
        let cachedPickerState = null;

        function normalizeSlug(value) {
            return String(value || '').trim().toLowerCase();
        }

        function computePickerState() {
            const params = new URLSearchParams(window.location.search);
            let isPickerView = params.get('picker') === '1';
            const fromUrl = normalizeSlug(params.get('community'));
            const pending = sessionStorage.getItem(PICKER_PENDING_KEY) === '1';
            const fromStore = normalizeSlug(sessionStorage.getItem(PICKER_COMMUNITY_KEY));

            // Legacy flag from older builds — never treat as persistent picker mode
            sessionStorage.removeItem('arisan_picker_active');

            if (!isPickerView && pending && fromStore) {
                isPickerView = true;
                sessionStorage.removeItem(PICKER_PENDING_KEY);
                if (!params.toString()) {
                    history.replaceState(null, '', ArisanLeagueContext.homeUrl(fromStore));
                }
            }

            if (!isPickerView) {
                sessionStorage.removeItem(PICKER_COMMUNITY_KEY);
                sessionStorage.removeItem(PICKER_PENDING_KEY);
                return {
                    isPickerView: false,
                    lockedCommunitySlug: '',
                    isCommunityLocked: false,
                };
            }

            const lockedCommunitySlug = fromUrl || fromStore;
            return {
                isPickerView: true,
                lockedCommunitySlug,
                isCommunityLocked: !!lockedCommunitySlug,
            };
        }

        function getPickerState() {
            if (!cachedPickerState) {
                cachedPickerState = computePickerState();
            }
            return cachedPickerState;
        }

        function setStatus(msg, isError) {
            statusEl.textContent = msg || '';
            statusEl.classList.toggle('error', !!isError);
        }

        function setLeagueStatus(msg, isError) {
            leagueStatusEl.textContent = msg || '';
            leagueStatusEl.classList.toggle('error', !!isError);
        }

        function applyLockedCommunityUi() {
            communitiesSection.classList.add('locked-mode');
            communityLockHint.classList.remove('hidden');
            leaguesSection.classList.remove('hidden');
        }

        function appendLockedCommunityCard(community, lockedSlug) {
            const el = document.createElement('div');
            el.className = 'card locked selected';
            el.setAttribute('aria-disabled', 'true');
            if (community) {
                el.innerHTML = '<strong>' + community.name + '</strong><span>' + community.slug + '</span>';
            } else {
                el.innerHTML = '<strong>' + lockedSlug + '</strong><span>' + lockedSlug + '</span>';
            }
            communityList.appendChild(el);
        }

        function goToAdminPanel() {
            const picker = getPickerState();
            if (picker.lockedCommunitySlug) {
                sessionStorage.setItem(PICKER_RETURN_KEY, picker.lockedCommunitySlug);
            }
            sessionStorage.removeItem(AUTH_KEY);
            sessionStorage.removeItem(PICKER_COMMUNITY_KEY);
            sessionStorage.removeItem(PICKER_PENDING_KEY);
            sessionStorage.removeItem('arisan_picker_active');
            window.location.assign(ArisanLeagueContext.siteIndexUrl());
        }

        function goBackFromGate() {
            const returnCommunity = normalizeSlug(sessionStorage.getItem(PICKER_RETURN_KEY));
            if (returnCommunity) {
                sessionStorage.removeItem(PICKER_RETURN_KEY);
                sessionStorage.setItem(PICKER_COMMUNITY_KEY, returnCommunity);
                sessionStorage.setItem(PICKER_PENDING_KEY, '1');
                window.location.assign(ArisanLeagueContext.homeUrl(returnCommunity));
                return;
            }
            if (window.history.length > 1) {
                window.history.back();
            }
        }

        function updateGateBackLink() {
            const gateBack = document.getElementById('gate-back');
            const returnCommunity = normalizeSlug(sessionStorage.getItem(PICKER_RETURN_KEY));
            gateBack.classList.toggle('hidden', !returnCommunity);
        }

        function unlockApp() {
            const picker = getPickerState();
            const pickerActions = document.getElementById('picker-actions');

            gateScreen.classList.add('hidden');
            mainApp.classList.remove('hidden');

            if (picker.isPickerView) {
                document.getElementById('create-actions').classList.add('hidden');
                pickerActions.classList.remove('hidden');
            } else {
                document.getElementById('create-actions').classList.remove('hidden');
                pickerActions.classList.add('hidden');
            }

            if (picker.isCommunityLocked) {
                applyLockedCommunityUi();
            }
            initApp();
        }

        function checkPassword() {
            const input = gatePassword.value.trim();
            if (input === ROOT_PASSWORD) {
                sessionStorage.setItem(AUTH_KEY, '1');
                sessionStorage.removeItem(PICKER_RETURN_KEY);
                gateError.classList.add('hidden');
                unlockApp();
            } else {
                gateError.classList.remove('hidden');
            }
        }

        document.getElementById('gate-submit').addEventListener('click', checkPassword);
        gatePassword.addEventListener('keydown', e => {
            if (e.key === 'Enter') checkPassword();
        });
        document.getElementById('gate-back').addEventListener('click', e => {
            e.preventDefault();
            goBackFromGate();
        });
        document.getElementById('admin-panel-link').addEventListener('click', e => {
            e.preventDefault();
            goToAdminPanel();
        });

        (function wireCreateActions() {
            if (!window.ArisanLeagueContext) return;
            const actions = document.getElementById('create-actions');
            if (!actions) return;
            const links = actions.querySelectorAll('a');
            if (links[0]) links[0].href = ArisanLeagueContext.appUrl('admin/community.html');
            if (links[1]) links[1].href = ArisanLeagueContext.appUrl('admin/setup.html?new=league');
        })();

        function renderCommunities(rows) {
            const picker = getPickerState();
            communitiesCache = rows;
            communityList.innerHTML = '';

            if (picker.isCommunityLocked) {
                applyLockedCommunityUi();
                const match = rows.find(c => normalizeSlug(c.slug) === picker.lockedCommunitySlug);
                appendLockedCommunityCard(match, picker.lockedCommunitySlug);
                return;
            }

            rows.forEach(c => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'card' + (selectedCommunitySlug === c.slug ? ' selected' : '');
                btn.innerHTML = '<strong>' + c.name + '</strong><span>' + c.slug + '</span>';
                btn.addEventListener('click', async () => {
                    await loadLeagues(c.slug, c.name);
                });
                communityList.appendChild(btn);
            });
        }

        async function loadLeagues(slug, name) {
            const picker = getPickerState();
            if (picker.isCommunityLocked) {
                slug = picker.lockedCommunitySlug;
                const match = communitiesCache.find(c => normalizeSlug(c.slug) === slug);
                name = match ? match.name : slug;
            }

            selectedCommunitySlug = slug;
            if (communitiesCache.length) {
                renderCommunities(communitiesCache);
            }

            leaguesSection.classList.remove('hidden');
            leagueContext.textContent = 'for ' + name;
            leagueList.innerHTML = '';
            setLeagueStatus('Loading leagues…');
            setStatus('');

            try {
                const leagues = await ArisanDB.listLeagues(slug);
                if (!leagues.length) {
                    setLeagueStatus('No leagues for this community yet.', true);
                    return;
                }
                leagues.forEach(l => {
                    const a = document.createElement('a');
                    a.className = 'card';
                    a.href = ArisanLeagueContext.leagueUrl(slug, l.slug);
                    a.innerHTML = '<strong>' + l.title + '</strong><span>' + (l.year || '') + ' · ' + l.slug + '</span>';
                    leagueList.appendChild(a);
                });
                setLeagueStatus('');
                if (!picker.isCommunityLocked) {
                    leaguesSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            } catch (e) {
                setLeagueStatus('Failed to load leagues: ' + e.message, true);
            }
        }

        async function initApp() {
            if (initAppStarted) return;
            initAppStarted = true;

            const picker = getPickerState();

            if (!ArisanDB.isConfigured()) {
                setStatus('Supabase is not configured.', true);
                return;
            }
            try {
                const communities = await ArisanDB.listCommunities();
                if (!communities.length) {
                    setStatus('No community data yet. Run migration + seed in Supabase.', true);
                    return;
                }

                communitiesCache = communities;

                if (picker.isCommunityLocked) {
                    applyLockedCommunityUi();
                    const community = communities.find(
                        c => normalizeSlug(c.slug) === picker.lockedCommunitySlug
                    );
                    if (!community) {
                        communityList.innerHTML = '';
                        appendLockedCommunityCard(null, picker.lockedCommunitySlug);
                        setLeagueStatus('Community not found: ' + picker.lockedCommunitySlug, true);
                        setStatus('');
                        return;
                    }
                    setStatus('');
                    await loadLeagues(community.slug, community.name);
                    return;
                }

                renderCommunities(communities);
                setStatus('');
                if (communities.length === 1) {
                    await loadLeagues(communities[0].slug, communities[0].name);
                }
            } catch (e) {
                setStatus('Failed to load communities (schema not deployed?): ' + e.message, true);
            }
        }

        if (getPickerState().isPickerView || sessionStorage.getItem(AUTH_KEY) === '1') {
            unlockApp();
        } else {
            updateGateBackLink();
            gatePassword.focus();
        }
    </script>
</body>
</html>
